<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Report Card by M.Borghei</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#4CAF50">
    <style>
        :root { --primary: #4CAF50; --danger: #f44336; --bg: #f4f7f6; --card: #fff; --border: #e0e0e0; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: #333; margin: 0; padding: 16px; padding-bottom: 100px; box-sizing: border-box; }
        h1 { text-align: center; color: var(--primary); font-size: 1.5rem; margin-bottom: 20px; }
        .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .card-title { font-size: 0.85rem; text-transform: uppercase; color: #888; margin-bottom: 12px; font-weight: 600; letter-spacing: 0.5px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 0.95rem; }
        input[type="text"], input[type="number"], input[type="date"] {
            width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; box-sizing: border-box;
        }
        input:focus { outline: none; border-color: var(--primary); }
        .radio-group { display: flex; gap: 12px; flex-wrap: wrap; }
        .radio-option { flex: 1; min-width: 80px; }
        .radio-option input { display: none; }
        .radio-option label { display: block; text-align: center; padding: 10px; border: 2px solid var(--border); border-radius: 8px; cursor: pointer; transition: 0.2s; font-weight: normal; }
        .radio-option input:checked + label { border-color: var(--primary); background: #e8f5e9; color: var(--primary); font-weight: 600; }
        .grade-row { display: flex; gap: 12px; }
        .grade-row .form-group { flex: 1; }
        .total-box { background: #e8f5e9; padding: 12px; border-radius: 8px; text-align: center; font-size: 1.2rem; font-weight: bold; color: var(--primary); margin-top: 10px; }
        .error { border-color: var(--danger) !important; background: #ffebee; }
        .error-msg { color: var(--danger); font-size: 0.8rem; margin-top: 4px; display: none; }
        #submitBtn { position: fixed; bottom: 16px; left: 16px; right: 16px; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 600; box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4); cursor: pointer; }
        #submitBtn:active { transform: scale(0.98); }
        .settings-toggle { text-align: right; font-size: 0.8rem; color: var(--primary); cursor: pointer; margin-bottom: 10px; }
    </style>
  <script type="module" crossorigin src="./assets/index-cd2dv0fi.js"></script>
</head>
<body>

    <h1>📝 Report Card by M.Borghei</h1>

    <div class="card">
        <div class="settings-toggle" onclick="document.getElementById('settingsContent').style.display = document.getElementById('settingsContent').style.display === 'none' ? 'block' : 'none'">⚙️ Toggle Settings</div>
        <div id="settingsContent" style="display:none;">
            <div class="card-title">General Info (Saved automatically)</div>
            <div class="form-group">
                <label for="teacher">Teacher Name</label>
                <input type="text" id="teacher" placeholder="e.g., Mr. Borghei">
            </div>
            <div class="form-group">
                <label for="coursename">Course Name</label>
                <input type="text" id="coursename" placeholder="e.g., Family and Friends 1A">
            </div>
            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date">
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">Student Details</div>
        <div class="form-group">
            <label for="studentname">Student Name</label>
            <input type="text" id="studentname" placeholder="e.g., Ali Mansouri">
        </div>
        <div class="form-group">
            <label>Term</label>
            <div class="radio-group" id="termGroup"></div>
        </div>
        <div class="form-group">
            <label>Status</label>
            <div class="radio-group" id="statusGroup"></div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">Grades</div>
        <div class="grade-row">
            <div class="form-group">
                <label for="mark_class">Class (Max 25)</label>
                <input type="number" id="mark_class" min="0" max="25" step="1" inputmode="numeric">
                <div class="error-msg" id="err_class">Max 25</div>
            </div>
            <div class="form-group">
                <label for="mark_oral">Oral (Max 25)</label>
                <input type="number" id="mark_oral" min="0" max="25" step="1" inputmode="numeric">
                <div class="error-msg" id="err_oral">Max 25</div>
            </div>
        </div>
        <div class="form-group">
            <label for="mark_final">Final Exam (Max 50)</label>
            <input type="number" id="mark_final" min="0" max="50" step="1" inputmode="numeric">
            <div class="error-msg" id="err_final">Max 50</div>
        </div>
        <div class="total-box">Total: <span id="mark_total">0</span> / 100</div>
    </div>

    <button id="submitBtn">Generate Report & Next Student</button>

</body>
</html>
